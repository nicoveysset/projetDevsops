name: ProjetDevOps Docker CI/CD

on:
  push:
    branches:
      - workflow

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f ProjetDevOps/docker-compose.yml config --quiet

  build-and-push:
    name: Build and publish ${{ matrix.service }}
    needs: validate-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - zabbix-server
          - zabbix-web
          - n8n
          - grafana
          - target-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ProjetDevOps/${{ matrix.service }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  create-release:
    name: Create GitHub release
    needs:
      - build-and-push
      - deploy-to-azure-vm
    if: github.ref == 'refs/heads/workflow' && always() && needs.build-and-push.result == 'success' && (needs.deploy-to-azure-vm.result == 'success' || needs.deploy-to-azure-vm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create next release and tag images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '[.[] | .tagName | select(test("^V[0-9]+$")) | ltrimstr("V") | tonumber] | max // 0')"
            release_version="V$((latest + 1))"
            if gh release create "$release_version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$release_version" --generate-notes; then
              break
            fi
            if [ "$(gh release view "$release_version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)" = "$GITHUB_SHA" ]; then
              break
            fi
            [ "$attempt" -lt 10 ] || exit 1
            sleep "$attempt"
          done
          image_namespace="${GITHUB_REPOSITORY,,}"
          for service in zabbix-server zabbix-web n8n grafana target-test; do
            image="ghcr.io/$image_namespace/$service"
            docker buildx imagetools create --tag "$image:$release_version" "$image:sha-$GITHUB_SHA"
          done

  deploy-to-azure-vm:
    name: Deploy to Azure VM over SSH
    if: github.ref == 'refs/heads/workflow' && vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: production
    needs:
      - validate-compose
      - build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$AZURE_VM_SSH_KEY" || { echo "Missing AZURE_VM_SSH_KEY secret"; exit 1; }
          test -n "$AZURE_VM_KNOWN_HOSTS" || { echo "Missing AZURE_VM_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Copy Compose file and start containers
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          test -n "$AZURE_VM_HOST" || { echo "Missing AZURE_VM_HOST secret"; exit 1; }
          test -n "$AZURE_VM_USER" || { echo "Missing AZURE_VM_USER secret"; exit 1; }

          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$AZURE_VM_USER@$AZURE_VM_HOST" 'mkdir -p ~/ProjetDevOps'
          scp "${ssh_opts[@]}" ProjetDevOps/docker-compose.yml "$AZURE_VM_USER@$AZURE_VM_HOST:~/ProjetDevOps/docker-compose.yml"

          image_namespace="${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA}"
          ssh "${ssh_opts[@]}" "$AZURE_VM_USER@$AZURE_VM_HOST" \
            "cd ~/ProjetDevOps && GHCR_NAMESPACE='$image_namespace' IMAGE_TAG='$image_tag' docker compose pull && GHCR_NAMESPACE='$image_namespace' IMAGE_TAG='$image_tag' docker compose up -d --no-build --remove-orphans"
