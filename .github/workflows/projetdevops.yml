name: ProjetDevOps Docker CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f ProjetDevOps/docker-compose.yml config --quiet

  build-and-push:
    name: Build and publish ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - zabbix-server
          - zabbix-web
          - n8n
          - grafana
          - target-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ProjetDevOps/${{ matrix.service }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy-to-azure-vm:
    name: Deploy to Azure VM
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: production
    needs:
      - validate-compose
      - build-and-push
    runs-on: [self-hosted, linux, azure-projetdevops]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull images and deploy Compose stack
        run: |
          IMAGE_NAMESPACE="${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          GHCR_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_TAG="$IMAGE_TAG" docker compose -f ProjetDevOps/docker-compose.yml pull
          GHCR_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_TAG="$IMAGE_TAG" docker compose -f ProjetDevOps/docker-compose.yml up -d --no-build --remove-orphans
