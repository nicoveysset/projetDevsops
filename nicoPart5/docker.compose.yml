services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: oc_n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://n8n:5679/
      N8N_EDITOR_BASE_URL: http://68.210.100.220:5679/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network
      - webhook_net

networks:
  app-network:
    driver: bridge
  webhook_net:
    external: true

volumes:
  n8n_data:
